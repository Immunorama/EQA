<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดเก็บผล EQA อัตโนมัติ</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box;}
        .container { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); text-align: center; max-width: 450px; width: 100%; }
        h2 { color: #333; margin-top: 0; }
        p.subtitle { color: #666; font-size: 14px; margin-bottom: 30px; }
        
        .upload-area { position: relative; border: 2px dashed #007bff; background: #f8fbff; border-radius: 8px; padding: 40px 20px; cursor: pointer; transition: 0.3s; margin-bottom: 20px; }
        .upload-area:hover { background: #eef5ff; border-color: #0056b3; }
        .upload-area input[type=file] { position: absolute; left: 0; top: 0; opacity: 0; cursor: pointer; height: 100%; width: 100%; }
        .upload-icon { font-size: 40px; margin-bottom: 10px; }
        .upload-text { font-size: 16px; font-weight: bold; color: #007bff; }
        
        #fileNameDisplay { margin-bottom: 20px; color: #333; font-weight: bold; font-size: 14px; word-break: break-all; }
        
        button { width: 100%; padding: 15px; background: #28a745; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background: #218838; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        
        #status { margin-top: 20px; font-weight: bold; white-space: pre-wrap; font-size: 14px; text-align: left; background: #f9f9f9; padding: 15px; border-radius: 8px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>ระบบจัดเก็บ EQA</h2>
    <p class="subtitle">ระบบจะอ่านข้อมูลจาก PDF และบันทึกลงฐานข้อมูลอัตโนมัติ</p>
    
    <form id="eqaForm">
        <div class="upload-area">
            <div class="upload-icon">📄</div>
            <div class="upload-text">คลิกเพื่อเลือกไฟล์ PDF</div>
            <input type="file" id="pdfFile" accept="application/pdf" required>
        </div>
        <div id="fileNameDisplay">ยังไม่ได้เลือกไฟล์</div>
        
        <button type="submit" id="submitBtn" disabled>อ่านข้อมูลและบันทึก</button>
    </form>
    
    <div id="status"></div>
</div>

<script>
    // === นำ Web App URL ที่ได้จาก GAS มาใส่ที่นี่ ===
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbx6eV8Q1ZMA5N3OacVPW_LFj5ImBWfFbdEQnIwnZeI6M012hNmLaI2khcfVGplb-gYA/exec'; 

    // ตั้งค่า Worker สำหรับไลบรารี PDF.js
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    // เช็คเมื่อมีการเลือกไฟล์
    document.getElementById('pdfFile').addEventListener('change', function(e) {
        const file = e.target.files[0];
        const btn = document.getElementById('submitBtn');
        const statusDiv = document.getElementById('status');
        
        statusDiv.style.display = 'none'; // ซ่อนสถานะเก่า

        if (file) {
            document.getElementById('fileNameDisplay').innerText = `ไฟลที่เลือก: ${file.name}`;
            btn.disabled = false;
        } else {
            document.getElementById('fileNameDisplay').innerText = 'ยังไม่ได้เลือกไฟล์';
            btn.disabled = true;
        }
    });

    // 1. ฟังก์ชันสกัดข้อความดิบทั้งหมดออกจาก PDF
    async function extractTextFromPDF(file) {
        const arrayBuffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument(arrayBuffer).promise;
        let fullText = '';
        for (let i = 1; i <= pdf.numPages; i++) {
            const page = await pdf.getPage(i);
            const textContent = await page.getTextContent();
            const pageText = textContent.items.map(item => item.str).join(' ');
            fullText += pageText + ' ';
        }
        return fullText;
    }

    // 2. ฟังก์ชันวิเคราะห์ข้อมูล (อ่านค่าตาม Format ของ RIQAS)
    function parseRIQASData(text) {
        // ใช้ Regular Expression (RegEx) เพื่อดักจับข้อความ
        const labRefNo = (text.match(/LABORATORY REF\. NO\.\s*([\d\.]+)/) || [])[1] || 'ไม่พบข้อมูล';
        const cycle = (text.match(/CYCLE\s*(\d+)/) || [])[1] || 'ไม่พบข้อมูล';
        const sample = (text.match(/SAMPLE\s*(\d+)/) || [])[1] || 'ไม่พบข้อมูล';
        const issueDate = (text.match(/Issue Date:\s*([\d\/]+)/) || [])[1] || 'ไม่พบข้อมูล';
        
        // กรองคำนึงถึงบริบทจากไฟล์ตัวอย่าง
        const eqaProgram = text.includes('SPECIFIC PROTEINS') ? 'SPECIFIC PROTEINS' : 'ไม่พบข้อมูล';
        let labName = text.includes('Ramathibodi Hospital') ? 'Ramathibodi Hospital (Immunology)' : 'ไม่พบข้อมูลหน่วยงาน';
        let machineName = text.includes('Dade Dimension') ? 'Dade Dimension' : 'ไม่พบชื่อเครื่อง';
        
        // ค้นหาชื่อ Test และ SDI จากส่วนของตาราง 
        // สมมติฐาน: "C-Reactive Protein 56.039 56.550 0.22"
        let testName = 'C-Reactive Protein';
        let sdi = 'ไม่พบข้อมูล';
        
        const sdiMatch = text.match(/C-Reactive Protein.*?([\d\.]+)\s+([\d\.]+)\s+([\d\.\-]+)/);
        if (sdiMatch) {
            sdi = sdiMatch[3]; // จับกลุ่มตัวเลขชุดที่ 3 ซึ่งเป็นตำแหน่งของ SDI
        }

        return { labName, eqaProgram, labRefNo, machineName, issueDate, cycle, sample, testName, sdi };
    }

    // 3. เมื่อกดปุ่ม Submit
    document.getElementById('eqaForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const fileInput = document.getElementById('pdfFile');
        const file = fileInput.files[0];
        const submitBtn = document.getElementById('submitBtn');
        const statusDiv = document.getElementById('status');

        if (!file) return;

        submitBtn.disabled = true;
        statusDiv.style.display = 'block';
        statusDiv.innerText = '⏳ 1/3 กำลังอ่านข้อมูลจาก PDF...';
        statusDiv.style.color = '#0056b3';

        try {
            // อ่าน Text จาก PDF
            const extractedText = await extractTextFromPDF(file);
            
            // สกัดฟิลด์ข้อมูล
            statusDiv.innerText = '🔍 2/3 กำลังวิเคราะห์ข้อมูลและดึงค่า...';
            const parsedData = parseRIQASData(extractedText);
            
            // แปลงไฟล์เป็น Base64
            const reader = new FileReader();
            reader.onload = function(event) {
                const base64Data = event.target.result.split(',')[1]; 

                // จัดเตรียม Payload ส่งให้ GAS
                const payload = {
                    ...parsedData,
                    fileName: file.name,
                    fileType: file.type,
                    fileBase64: base64Data
                };

                statusDiv.innerText = '☁️ 3/3 กำลังบันทึกไฟล์และข้อมูลลง Google Sheets...';

                // ส่ง API ไปบันทึก
                fetch(GAS_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                })
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        statusDiv.style.color = 'green';
                        statusDiv.innerHTML = `✅ <b>บันทึกสำเร็จ! ข้อมูลที่ดึงได้:</b><br><br>
                        • <b>Lab Ref:</b> ${parsedData.labRefNo}<br>
                        • <b>Cycle/Sample:</b> ${parsedData.cycle} / ${parsedData.sample}<br>
                        • <b>Issue Date:</b> ${parsedData.issueDate}<br>
                        • <b>Test Name:</b> ${parsedData.testName}<br>
                        • <b>SDI:</b> ${parsedData.sdi}`;
                        
                        document.getElementById('eqaForm').reset();
                        document.getElementById('fileNameDisplay').innerText = 'ยังไม่ได้เลือกไฟล์';
                    } else {
                        statusDiv.innerText = '❌ เกิดข้อผิดพลาดฝั่งเซิร์ฟเวอร์: ' + data.message;
                        statusDiv.style.color = 'red';
                    }
                })
                .catch(err => {
                    statusDiv.innerText = '❌ เกิดข้อผิดพลาดในการเชื่อมต่อ (CORS หรือ URL ผิด)';
                    statusDiv.style.color = 'red';
                })
                .finally(() => {
                    submitBtn.disabled = false;
                    submitBtn.innerText = 'อ่านข้อมูลและบันทึก';
                });
            };
            
            // เริ่มการอ่านไฟล์ Base64
            reader.readAsDataURL(file);

        } catch (error) {
            console.error(error);
            statusDiv.style.display = 'block';
            statusDiv.innerText = '❌ ไม่สามารถอ่านตัวหนังสือจาก PDF นี้ได้ (อาจเป็นไฟล์ภาพที่ถูกแสกน)';
            statusDiv.style.color = 'red';
            submitBtn.disabled = false;
            submitBtn.innerText = 'อ่านข้อมูลและบันทึก';
        }
    });
</script>

</body>
</html>

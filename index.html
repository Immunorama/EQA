<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>อ่านข้อมูล RIQAS PDF</title>
    <!-- นำเข้าไลบรารี PDF.js ผ่าน CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f9f9f9;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h2 {
            color: #333;
        }
        input[type="file"] {
            margin-bottom: 20px;
        }
        #result {
            background-color: #2d2d2d;
            color: #4af626;
            padding: 15px;
            border-radius: 5px;
            white-space: pre-wrap;
            min-height: 100px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>โปรแกรมดึงข้อมูล RIQAS จาก PDF</h2>
    <p>กรุณาเลือกไฟล์ PDF เพื่อทำการสกัดข้อมูล</p>
    
    <!-- ปุ่มอัปโหลดไฟล์ -->
    <input type="file" id="pdf-upload" accept="application/pdf">
    
    <h3>ผลลัพธ์:</h3>
    <!-- พื้นที่แสดงผลลัพธ์ -->
    <pre id="result">รอรับไฟล์...</pre>
</div>

<script>
    // ตั้งค่า Worker ของ PDF.js
    const pdfjsLib = window['pdfjs-dist/build/pdf'];
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    const fileInput = document.getElementById('pdf-upload');
    const resultBox = document.getElementById('result');

    // เมื่อผู้ใช้เลือกไฟล์
    fileInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file.type !== 'application/pdf') {
            resultBox.textContent = 'กรุณาอัปโหลดไฟล์ PDF เท่านั้นครับ';
            return;
        }

        resultBox.textContent = 'กำลังประมวลผล...';

        const fileReader = new FileReader();
        
        fileReader.onload = async function() {
            try {
                // แปลงไฟล์เป็น ArrayBuffer
                const typedarray = new Uint8Array(this.result);

                // โหลด PDF ด้วย PDF.js
                const pdf = await pdfjsLib.getDocument(typedarray).promise;
                let fullText = '';

                // วนลูปอ่านทีละหน้า
                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const textContent = await page.getTextContent();
                    const pageText = textContent.items.map(item => item.str).join(' ');
                    fullText += pageText + '\n';
                }

                // สกัดข้อมูลด้วย Regex (เหมือนใน Node.js)
                const data = parseRIQASData(fullText);
                
                // แสดงผลลัพธ์บนหน้าจอ
                resultBox.textContent = JSON.stringify(data, null, 4);

            } catch (error) {
                console.error(error);
                resultBox.textContent = 'เกิดข้อผิดพลาดในการอ่านไฟล์: ' + error.message;
            }
        };

        fileReader.readAsArrayBuffer(file);
    });

    // ฟังก์ชันสำหรับใช้ Regex สกัดข้อความ
    function parseRIQASData(text) {
        const labRefMatch = text.match(/LABORATORY\s+REF\.\s+NO\.\s*([\d\.]+)/i);
        const instrumentMatch = text.match(/(Reg\s*\([A-Za-z]\)\s*-\s*[^\n\r]+)/i);
        const hospitalMatch = text.match(/(Faculty of Medicine [^\n\r]+)/i);
        const programMatch = text.match(/(IMMUNOASSAY SPECIALITY \d+)/i);
        const cycleSampleMatch = text.match(/CYCLE\s+(\d+)\s+SAMPLE\s+(\d+)/i);
        const issueDateMatch = text.match(/Issue Date:\s*([\d\/]+)/i);

        return {
            labRefNo: labRefMatch ? labRefMatch[1].trim() : "ไม่พบข้อมูล",
            instrumentName: instrumentMatch ? instrumentMatch[1].trim() : "ไม่พบข้อมูล",
            hospital: hospitalMatch ? hospitalMatch[1].trim() : "ไม่พบข้อมูล",
            program: programMatch ? programMatch[1].trim() : "ไม่พบข้อมูล",
            cycle: cycleSampleMatch ? cycleSampleMatch[1] : "ไม่พบข้อมูล",
            sample: cycleSampleMatch ? cycleSampleMatch[2] : "ไม่พบข้อมูล",
            issueDate: issueDateMatch ? issueDateMatch[1] : "ไม่พบข้อมูล",
        };
    }
</script>

</body>
</html>

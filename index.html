<form id="uploadForm">
  <input type="file" id="pdfFile" accept="application/pdf">
  <input type="text" id="department" placeholder="ชื่อหน่วยงาน">
  <!-- ใส่ฟิลด์อื่นๆ ตามต้องการ -->
  <button type="button" onclick="uploadData()">Submit</button>
</form>

<script>
  function uploadData() {
    const file = document.getElementById('pdfFile').files[0];
    const reader = new FileReader();
    
    reader.onload = function(e) {
      const data = {
        fileName: file.name,
        fileType: file.type,
        fileData: e.target.result.split(',')[1],
        department: document.getElementById('department').value,
        // เพิ่มข้อมูลอื่นๆ ที่ดึงมาได้จากหน้าเว็บ
      };
      
      fetch('https://script.google.com/acros/s/AKfycbx6eV8Q1ZMA5N3OacVPW_LFj5ImBWfFbdEQnIwnZeI6M012hNmLaI2khcfVGplb-gYA/exec', {
        method: 'POST',
        body: JSON.stringify(data)
      }).then(res => alert('บันทึกสำเร็จ'));
    };
    reader.readAsDataURL(file);
  }
</script>

<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบดึงข้อมูลจาก PDF | PDF Extractor</title>
    
    <!-- ส่วนของการตกแต่ง (CSS) -->
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            color: #333;
            line-height: 1.6;
        }
        header {
            background-color: #007bff;
            color: white;
            text-align: center;
            padding: 2rem 0;
        }
        main {
            padding: 20px;
            max-width: 800px;
            margin: 30px auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1, h2 {
            margin-top: 0;
        }
        .btn {
            display: inline-block;
            padding: 10px 20px;
            background-color: #28a745;
            color: white;
            text-decoration: none;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-bottom: 15px;
        }
        .btn:hover {
            background-color: #218838;
        }
        textarea {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            margin-bottom: 15px;
            font-family: monospace;
            resize: vertical;
        }
        .result-box {
            padding: 15px;
            background-color: #e9ecef;
            border-left: 5px solid #007bff;
            border-radius: 4px;
            font-size: 18px;
        }
        footer {
            text-align: center;
            padding: 15px 0;
            margin-top: 40px;
            background-color: #343a40;
            color: white;
        }
    </style>
</head>
<body>

    <!-- ส่วนหัวของเว็บไซต์ -->
    <header>
        <h1>ระบบดึงชื่อเครื่องจากไฟล์ RIQAS</h1>
        <p>วางข้อความดิบที่ได้จากไฟล์ PDF เพื่อทดสอบการทำงาน</p>
    </header>

    <!-- ส่วนเนื้อหาหลัก -->
    <main>
        <h2>ทดสอบ Regex</h2>
        <p>กรุณาวางข้อความที่อ่านได้จากไฟล์ PDF ลงในกล่องด้านล่าง (ตัวอย่างเช่น: <code>LABORATORY REF. NO. 222557.5 Dade Behring Ramathibodi Hospital...</code>)</p>
        
        <!-- กล่องสำหรับใส่ข้อความ -->
        <textarea id="pdfTextInput" rows="8" placeholder="วางข้อความจาก PDF ที่นี่..."></textarea>

        <!-- ปุ่มกดเพื่อทำงาน -->
        <button id="extractBtn" class="btn">ดึงชื่อเครื่อง</button>
        
        <!-- ส่วนแสดงผลลัพธ์ -->
        <div class="result-box">
            <strong>ชื่อเครื่องที่ดึงได้: </strong> 
            <span id="resultText" style="color: #d9534f;">-</span>
        </div>
    </main>

    <!-- ส่วนท้ายของเว็บไซต์ -->
    <footer>
        <p>&copy; 2026 My Website. All rights reserved.</p>
    </footer>

    <!-- ส่วนของการทำงาน (JavaScript) -->
    <script>
        // เมื่อกดปุ่ม "ดึงชื่อเครื่อง" ให้รันฟังก์ชันนี้
        document.getElementById('extractBtn').addEventListener('click', function() {
            // 1. อ่านข้อความที่ผู้ใช้พิมพ์หรือวางลงใน textarea
            const fullText = document.getElementById('pdfTextInput').value;
            
            // 2. กำหนด Regex สำหรับค้นหาชื่อเครื่อง
            // ค้นหาข้อความที่อยู่ระหว่าง LABORATORY REF. NO. [ตัวเลข] และ Ramathibodi Hospital
            const machineRegex = /LABORATORY REF\. NO\.\s*[\d\.]+\s+(.*?)\s+Ramathibodi Hospital/i;
            const machineMatch = fullText.match(machineRegex);

            // 3. ตรวจสอบว่าเจอคำที่ตรงเงื่อนไขหรือไม่
            let machineName = "ไม่พบข้อมูล (ตรวจสอบรูปแบบข้อความอีกครั้ง)";
            if (machineMatch && machineMatch[1]) {
                machineName = machineMatch[1].trim(); // ลบช่องว่างส่วนเกินหน้า-หลัง
            }

            // 4. นำผลลัพธ์ไปแสดงบนหน้าจอ
            const resultSpan = document.getElementById('resultText');
            resultSpan.innerText = machineName;
            
            // เปลี่ยนสีข้อความเมื่อค้นหาเจอ
            if (machineName !== "ไม่พบข้อมูล (ตรวจสอบรูปแบบข้อความอีกครั้ง)") {
                resultSpan.style.color = "#28a745"; // สีเขียวถ้าเจอข้อมูล
            } else {
                resultSpan.style.color = "#d9534f"; // สีแดงถ้าไม่เจอ
            }
        });
    </script>

</body>
</html>

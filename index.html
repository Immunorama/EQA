<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>อัปโหลดผล EQA (RIQAS)</title>
    <!-- เรียกใช้ PDF.js จาก CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <style>
        body { font-family: 'Sarabun', Tahoma, sans-serif; margin: 20px; background-color: #f4f7f6; }
        .container { max-width: 600px; margin: auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; }
        .file-upload { display: flex; flex-direction: column; gap: 15px; margin-bottom: 20px; }
        label { font-weight: bold; }
        input[type="file"] { padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
        button { background: #28a745; color: white; border: none; padding: 12px; font-size: 16px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:hover { background: #218838; }
        button:disabled { background: #cccccc; cursor: not-allowed; }
        #status { margin-top: 20px; font-weight: bold; text-align: center; color: #0056b3; }
    </style>
</head>
<body>

<div class="container">
    <h2>อัปโหลดและแยกข้อมูลผล EQA (RIQAS)</h2>
    
    <div class="file-upload">
        <label for="pdfFile">เลือกไฟล์ PDF:</label>
        <input type="file" id="pdfFile" accept="application/pdf">
        <button id="uploadBtn">แยกข้อมูลและส่งไปยัง Google Sheets</button>
    </div>

    <div id="status"></div>
</div>

<script>
    // ตั้งค่า Worker ของ PDF.js
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    // เปลี่ยนเป็น Web App URL ของคุณที่ได้จากการ Deploy Google Apps Script
    const GOOGLE_APP_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx6eV8Q1ZMA5N3OacVPW_LFj5ImBWfFbdEQnIwnZeI6M012hNmLaI2khcfVGplb-gYA/exec';

    // ฟังก์ชันอ่านข้อความจาก PDF (แยกหน้าแรกและหน้าสุดท้าย)
    async function extractTextFromPDF(file) {
        const arrayBuffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument(arrayBuffer).promise;
        
        let firstPageText = '';
        let lastPageText = '';
        let fullText = '';

        for (let i = 1; i <= pdf.numPages; i++) {
            const page = await pdf.getPage(i);
            const textContent = await page.getTextContent();
            // เว้นวรรคข้อความที่ติดกัน
            const pageText = textContent.items.map(item => item.str).join(' ');
            
            if (i === 1) firstPageText = pageText;
            if (i === pdf.numPages) lastPageText = pageText;
            
            fullText += pageText + ' ';
        }
        
        return { firstPageText, lastPageText, fullText, numPages: pdf.numPages };
    }

    // ฟังก์ชันใช้ Regex ดึงข้อมูล
    function parseRIQASData(pdfTexts) {
        const firstPage = pdfTexts.firstPageText;
        const lastPage = pdfTexts.lastPageText;
        
        // 1. ดึงข้อมูลทั่วไปจากหน้าแรก
        const labRefMatch = firstPage.match(/LABORATORY REF\.\s*NO\.\s*([\d\.]+)/i);
        const cycleMatch = firstPage.match(/CYCLE\s*(\d+)/i);
        const sampleMatch = firstPage.match(/SAMPLE\s*(\d+)/i);
        const issueDateMatch = firstPage.match(/Issue Date:\s*([\d\/]+)/i);
        
        // ค้นหาชื่อโปรแกรม (ตัวอย่าง)
        let eqaProgram = "ไม่ทราบโปรแกรม";
        if (firstPage.toUpperCase().includes("SPECIFIC PROTEINS")) eqaProgram = "Specific Proteins";
        else if (firstPage.toUpperCase().includes("CLINICAL CHEMISTRY")) eqaProgram = "Clinical Chemistry";
        else if (firstPage.toUpperCase().includes("IMMUNOASSAY")) eqaProgram = "Immunoassay";
        
        // ค้นหาชื่อเครื่องตรวจจากหน้าแรก (Regex อาจต้องปรับแต่งตามรูปแบบจริงใน PDF)
        const machineMatch = firstPage.match(/Reg\s*\([A-Za-z]\)\s*-\s*(.+?)(?=\s*Authorised|\s*Issue|\s*Page)/i);
        const machineName = machineMatch ? machineMatch[1].trim() : "ไม่พบชื่อเครื่องตรวจ";

        // 2. ดึงข้อมูลการทดสอบ (Tests) จากหน้าสุดท้าย
        const tests = [];
        // ค้นหาค่าในตารางสรุปผล (Summary table)
        // สมมติว่าโครงสร้างคือ: Analyte | Mean for Comparison | Your Result | SDI | ...
        // รูปแบบตัวเลขเช่น 229.667 227.000 -0.22
        // Regex ตัวอย่าง (ดึงข้อความที่เป็นชื่อและตามด้วยกลุ่มตัวเลข)
        const testRegex = /([A-Za-z0-9\s\-]+?)\s+([-\d\.]+)\s+([-\d\.]+)\s+([-\d\.]+)\s+([-\d\.]+)/g;
        
        // พยายามแยกส่วนเนื้อหาที่เป็นสรุปผล
        let summarySection = lastPage;
        const summaryMatch = lastPage.match(/Summary of Performance(.*)/i);
        if (summaryMatch) {
            summarySection = summaryMatch[1];
        }

        let match;
        while ((match = testRegex.exec(summarySection)) !== null) {
            let analyte = match[1].trim();
            // กรองขยะหรือคำที่ไม่ใช่ Analyte ออก
            if (analyte.length > 2 && !analyte.toLowerCase().includes("page") && !analyte.toLowerCase().includes("mean")) {
                tests.push({
                    testName: analyte,
                    sdi: match[4] // สมมติว่า SDI อยู่ตำแหน่งที่ 4 ตามลักษณะตาราง
                });
            }
        }

        return {
            labRefNo: labRefMatch ? labRefMatch[1] : "-",
            cycle: cycleMatch ? cycleMatch[1] : "-",
            sample: sampleMatch ? sampleMatch[1] : "-",
            issueDate: issueDateMatch ? issueDateMatch[1] : "-",
            eqaProgram: eqaProgram,
            machineName: machineName,
            tests: tests
        };
    }

    // จัดการ Event เมื่อกดปุ่ม
    document.getElementById('uploadBtn').addEventListener('click', async () => {
        const fileInput = document.getElementById('pdfFile');
        const statusDiv = document.getElementById('status');
        const btn = document.getElementById('uploadBtn');

        if (fileInput.files.length === 0) {
            alert('กรุณาเลือกไฟล์ PDF ก่อนครับ');
            return;
        }

        try {
            btn.disabled = true;
            statusDiv.textContent = 'กำลังอ่านไฟล์ PDF...';
            statusDiv.style.color = '#0056b3';

            const file = fileInput.files[0];
            
            // อ่านข้อความ (แยกหน้า)
            const extractedData = await extractTextFromPDF(file);
            
            statusDiv.textContent = 'กำลังแยกข้อมูล (Parsing)...';
            
            // ประมวลผลข้อมูล
            const parsedData = parseRIQASData(extractedData);
            
            console.log('ข้อมูลที่ดึงได้:', parsedData);

            if (parsedData.tests.length === 0) {
                statusDiv.textContent = 'ดึงข้อมูลสำเร็จ แต่ไม่พบรายการ Test (โปรดตรวจสอบ Regex หรือรูปแบบ PDF)';
                statusDiv.style.color = '#ff9800';
                btn.disabled = false;
                return; // อาจจะใส่ return หรือยอมให้ส่งข้อมูลไปโดยที่ tests เป็นอาร์เรย์ว่างก็ได้
            }

            statusDiv.textContent = 'กำลังส่งข้อมูลไปยัง Google Sheets...';

            // ส่งข้อมูลไปยัง Google Apps Script
            const response = await fetch(GOOGLE_APP_SCRIPT_URL, {
                method: 'POST',
                // หากติดปัญหา CORS ให้ใช้ 'text/plain' แล้วค่อย JSON.parse ที่ฝั่ง Server
                headers: {
                    'Content-Type': 'text/plain;charset=utf-8', 
                },
                body: JSON.stringify(parsedData)
            });

            const result = await response.json();

            if (result.status === 'success') {
                statusDiv.textContent = '✅ บันทึกข้อมูลเรียบร้อยแล้ว!';
                statusDiv.style.color = '#28a745';
                fileInput.value = ''; // เคลียร์ช่องเลือกไฟล์
            } else {
                throw new Error(result.message || 'เกิดข้อผิดพลาดจากฝั่ง Server');
            }

        } catch (error) {
            console.error('Error:', error);
            statusDiv.textContent = '❌ เกิดข้อผิดพลาด: ' + error.message;
            statusDiv.style.color = '#dc3545';
        } finally {
            btn.disabled = false;
        }
    });
</script>

</body>
</html>

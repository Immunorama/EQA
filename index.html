<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดเก็บผล EQA อัตโนมัติ</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box;}
        .container { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); text-align: center; max-width: 450px; width: 100%; }
        h2 { color: #333; margin-top: 0; }
        p.subtitle { color: #666; font-size: 14px; margin-bottom: 30px; }
        
        .upload-area { position: relative; border: 2px dashed #007bff; background: #f8fbff; border-radius: 8px; padding: 40px 20px; cursor: pointer; transition: 0.3s; margin-bottom: 20px; }
        .upload-area:hover { background: #eef5ff; border-color: #0056b3; }
        .upload-area input[type=file] { position: absolute; left: 0; top: 0; opacity: 0; cursor: pointer; height: 100%; width: 100%; }
        .upload-icon { font-size: 40px; margin-bottom: 10px; }
        .upload-text { font-size: 16px; font-weight: bold; color: #007bff; }
        
        #fileNameDisplay { margin-bottom: 20px; color: #333; font-weight: bold; font-size: 14px; word-break: break-all; }
        
        button { width: 100%; padding: 15px; background: #28a745; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background: #218838; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        
        #status { margin-top: 20px; font-weight: bold; white-space: pre-wrap; font-size: 14px; text-align: left; background: #f9f9f9; padding: 15px; border-radius: 8px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>ระบบจัดเก็บ EQA</h2>
    <p class="subtitle">ระบบจะอ่านข้อมูลจาก PDF และบันทึกลงฐานข้อมูลอัตโนมัติ</p>
    
    <form id="eqaForm">
        <div class="upload-area">
            <div class="upload-icon">📄</div>
            <div class="upload-text">คลิกเพื่อเลือกไฟล์ PDF</div>
            <input type="file" id="pdfFile" accept="application/pdf" required>
        </div>
        <div id="fileNameDisplay">ยังไม่ได้เลือกไฟล์</div>
        
        <button type="submit" id="submitBtn" disabled>อ่านข้อมูลและบันทึก</button>
    </form>
    
    <div id="status"></div>
</div>

<script>
    // === นำ Web App URL ที่ได้จาก GAS มาใส่ที่นี่ ===
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbx6eV8Q1ZMA5N3OacVPW_LFj5ImBWfFbdEQnIwnZeI6M012hNmLaI2khcfVGplb-gYA/exec'; 

   pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    document.getElementById('pdfFile').addEventListener('change', function(e) {
        const file = e.target.files[0];
        const btn = document.getElementById('submitBtn');
        const statusDiv = document.getElementById('status');
        
        statusDiv.style.display = 'none';

        if (file) {
            document.getElementById('fileNameDisplay').innerText = `ไฟล์ที่เลือก: ${file.name}`;
            btn.disabled = false;
        } else {
            document.getElementById('fileNameDisplay').innerText = 'ยังไม่ได้เลือกไฟล์';
            btn.disabled = true;
        }
    });

    async function extractTextFromPDF(file) {
        const arrayBuffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument(arrayBuffer).promise;
        let fullText = '';
        for (let i = 1; i <= pdf.numPages; i++) {
            const page = await pdf.getPage(i);
            const textContent = await page.getTextContent();
            const pageText = textContent.items.map(item => item.str).join(' ');
            fullText += pageText + ' ';
        }
        return fullText;
    }

    function parseRIQASData(text) {
        const labRefNoMatch = text.match(/LABORATORY REF\. NO\.\s*([\d\.]+)/);
        const labRefNo = labRefNoMatch ? labRefNoMatch[1] : 'ไม่พบข้อมูล';
        
        const cycleMatch = text.match(/CYCLE\s*(\d+)/i);
        const cycle = cycleMatch ? cycleMatch[1] : 'ไม่พบข้อมูล';
        
        const sampleMatch = text.match(/SAMPLE\s*(\d+)/i);
        const sample = sampleMatch ? sampleMatch[1] : 'ไม่พบข้อมูล';
        
        const issueDateMatch = text.match(/Issue Date:\s*([\d\/]+)/i);
        const issueDate = issueDateMatch ? issueDateMatch[1] : 'ไม่พบข้อมูล';
        
        const eqaProgram = text.includes('SPECIFIC PROTEINS') ? 'SPECIFIC PROTEINS' : 'ไม่พบข้อมูล';
        
        const labNameMatch = text.match(/^(.+?)\s+SPECIFIC PROTEINS/);
        let labName = labNameMatch ? labNameMatch[1].trim() : 'ไม่พบข้อมูลหน่วยงาน';
        if(labName.includes("PAGE")) {
            labName = labName.replace(/--- PAGE \d+ ---/, '').trim();
        }

        let machineName = 'ไม่พบชื่อเครื่อง';
        const machineRegex = /LABORATORY REF\. NO\.\s*[\d\.]+\s*(?:Reg\s*\([A-Za-z]\)\s*-\s*)?([^"]+?)\s*(?="?Authorised by|"Authorised|Issue No)/i;
        const machineMatch = text.match(machineRegex);
        if (machineMatch) {
            machineName = machineMatch[1].trim(); 
        }

        // --- ส่วนที่ดึงข้อมูลทุก Test จากตารางหน้าสุดท้าย ---
        let tests = [];
        const summaryRegex = /Performance\s+(.*?)(?:ORMSDI|END OF REPORT)/;
        const summaryMatch = text.match(summaryRegex);

        if (summaryMatch) {
            const summaryText = summaryMatch[1];
            // Regex หากลุ่มคำที่เป็นชื่อ Test ตามด้วยตัวเลข 8 ชุด
            const rowRegex = /([A-Za-z0-9\s\-]+?)\s+([-\d\.]+)\s+([-\d\.]+)\s+([-\d\.]+)\s+([-\d\.]+)\s+([-\d\.]+)\s+([-\d\.]+)\s+([-\d\.]+)\s+([-\d\.]+)/g;
            
            let match;
            while ((match = rowRegex.exec(summaryText)) !== null) {
                let testName = match[1].trim();
                // ป้องกันการจับคำว่า Analyte ที่เป็นหัวตาราง
                if(testName.toLowerCase() !== 'analyte' && testName !== '') {
                    tests.push({
                        testName: testName,
                        sdi: match[4] // จับค่าในคอลัมน์ SDI
                    });
                }
            }
        }

        // ถ้าหาไม่เจอจริงๆ ให้ส่งค่าเตือนไป
        if (tests.length === 0) {
            tests.push({ testName: 'ไม่พบข้อมูลการทดสอบ', sdi: '-' });
        }

        return { labName, eqaProgram, labRefNo, machineName, issueDate, cycle, sample, tests };
    }

    document.getElementById('eqaForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const fileInput = document.getElementById('pdfFile');
        const file = fileInput.files[0];
        const submitBtn = document.getElementById('submitBtn');
        const statusDiv = document.getElementById('status');

        if (!file) return;

        submitBtn.disabled = true;
        statusDiv.style.display = 'block';
        statusDiv.innerText = '⏳ 1/3 กำลังอ่านข้อมูลจาก PDF...';
        statusDiv.style.color = '#0056b3';

        try {
            const extractedText = await extractTextFromPDF(file);
            
            statusDiv.innerText = '🔍 2/3 กำลังวิเคราะห์ข้อมูลและดึงค่า...';
            const parsedData = parseRIQASData(extractedText);
            
            const reader = new FileReader();
            reader.onload = function(event) {
                const base64Data = event.target.result.split(',')[1]; 

                // ส่ง Array ของ Tests เข้าไปใน Payload
                const payload = {
                    ...parsedData,
                    fileName: file.name,
                    fileType: file.type,
                    fileBase64: base64Data
                };

                statusDiv.innerText = '☁️ 3/3 กำลังบันทึกไฟล์และข้อมูลลง Google Sheets...';

                fetch(GAS_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                })
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        statusDiv.style.color = 'green';
                        
                        // สร้างรายการ Test ที่ดึงมาได้เพื่อแสดงผลให้ User ดู
                        let testsHTML = parsedData.tests.map(t => `• <b>${t.testName}</b> (SDI: ${t.sdi})`).join('<br>');
                        
                        statusDiv.innerHTML = `✅ <b>บันทึกสำเร็จทั้งหมด ${parsedData.tests.length} รายการ! ข้อมูลที่ดึงได้:</b><br><br>
                        • <b>Lab Ref:</b> ${parsedData.labRefNo}<br>
                        • <b>เครื่อง:</b> ${parsedData.machineName}<br>
                        • <b>Cycle/Sample:</b> ${parsedData.cycle} / ${parsedData.sample}<br>
                        • <b>Issue Date:</b> ${parsedData.issueDate}<br><br>
                        <b>รายการทดสอบที่บันทึก:</b><br>
                        ${testsHTML}`;
                        
                        document.getElementById('eqaForm').reset();
                        document.getElementById('fileNameDisplay').innerText = 'ยังไม่ได้เลือกไฟล์';
                    } else {
                        statusDiv.innerText = '❌ เกิดข้อผิดพลาดฝั่งเซิร์ฟเวอร์: ' + data.message;
                        statusDiv.style.color = 'red';
                    }
                })
                .catch(err => {
                    statusDiv.innerText = '❌ เกิดข้อผิดพลาดในการเชื่อมต่อ (CORS หรือ URL ผิด)';
                    statusDiv.style.color = 'red';
                })
                .finally(() => {
                    submitBtn.disabled = false;
                    submitBtn.innerText = 'อ่านข้อมูลและบันทึก';
                });
            };
            
            reader.readAsDataURL(file);

        } catch (error) {
            console.error(error);
            statusDiv.style.display = 'block';
            statusDiv.innerText = '❌ ไม่สามารถอ่านตัวหนังสือจาก PDF นี้ได้ (อาจเป็นไฟล์ภาพที่ถูกสแกน)';
            statusDiv.style.color = 'red';
            submitBtn.disabled = false;
            submitBtn.innerText = 'อ่านข้อมูลและบันทึก';
        }
    });
</script>

</body>
</html>
